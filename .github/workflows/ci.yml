name: Validate workforce app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:config
      - run: npm run test:db
      - name: Test rota migrations and permissions
        run: npm run test:rotas:db
      - name: Test consistent overview snapshots
        run: npm run test:overview:db
      - name: Test Time Clock migrations and permissions
        run: npm run test:time-clock:db
      - name: Test Quick Tasks migrations and permissions
        run: npm run test:quick-tasks:db
      - name: Test team timesheet snapshots and exports
        run: npm run test:team-timesheets:db
      - name: Test joined-conversation message search
        run: npm run test:chat-search:db
      - name: Time Off database checks
        run: npm run test:time-off:db
      - name: Updates database checks
        run: npm run test:updates:db
      - name: Updates recipient export checks
        run: npm run test:updates-export:db
      - name: Smart Groups database checks
        run: npm run test:smart-groups:db
      - name: Knowledge Base database checks
        run: npm run test:knowledge-base:db
      - name: Forms database checks
        run: npm run test:forms:db
      - name: Forms reporting database checks
        run: npm run test:forms-reporting:db
      - name: Knowledge Base files and genuine Storage checks
        run: npm run test:knowledge-base-files:db
      - run: npm run build
